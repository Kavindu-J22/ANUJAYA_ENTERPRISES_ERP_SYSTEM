        bank: raw.bank || INITIAL_ERP_DATA.bank,
        expenses: Array.isArray(raw.expenses) ? raw.expenses : INITIAL_ERP_DATA.expenses,
        masterCustomers: Array.isArray(raw.masterCustomers) ? raw.masterCustomers.map(c => ({
          ...c,
          isArchived: !!c.isArchived,
          rentals: Array.isArray(c.rentals) ? c.rentals.map(r => ({
            ...r,
            startDate: r.startDate || "2026-08-01",
            isProratedFirstMonth: r.isProratedFirstMonth !== undefined ? !!r.isProratedFirstMonth : false
          })) : []
        })) : INITIAL_MASTER_CUSTOMERS,
        partners: Array.isArray(raw.partners) ? raw.partners.map(p => ({
          ...p,
          purchases: Array.isArray(p.purchases) ? p.purchases : [],
          returns: Array.isArray(p.returns) ? p.returns : [],
          payments: Array.isArray(p.payments) ? p.payments : []
        })) : INITIAL_PARTNERS,
        monthlyPayments: raw.monthlyPayments && typeof raw.monthlyPayments === "object" ? raw.monthlyPayments : INITIAL_ERP_DATA.monthlyPayments
      };
    }

    function parseMonthYear(monthStr) {
      if (!monthStr) return { year: 2026, monthIndex: 7 };
      const parts = monthStr.split(" ");
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const mIdx = monthNames.indexOf(parts[0]);
      const y = parseInt(parts[1]) || 2026;
      return { year: y, monthIndex: mIdx >= 0 ? mIdx : 7 };
    }

    function getDaysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function calculateMachineRentForMonth(rental, targetMonth) {
      if (!rental || rental.status !== "Active") return 0;
      const baseMonthly = Number(rental.rentRate || 0);
      if (!rental.startDate || !rental.isProratedFirstMonth) return baseMonthly;

      const [sYear, sMonth, sDay] = rental.startDate.split("-").map(Number);
      const { year: tYear, monthIndex: tMonthIndex } = parseMonthYear(targetMonth);

      if (sYear === tYear && (sMonth - 1) === tMonthIndex) {
        const totalDays = getDaysInMonth(tYear, tMonthIndex);
        const billableDays = Math.max(1, totalDays - sDay + 1);
        const calculated = Math.round((baseMonthly / totalDays) * billableDays);
        return calculated;
      }
      return baseMonthly;
    }

                            <th className="p-2.5">Code</th>
                            <th className="p-2.5">Industrial Machinery Fleet Model & Description</th>
                            <th className="p-2.5">Serial Number</th>
                            <th className="p-2.5">Accessories & Stand</th>
                            <th className="p-2.5 text-right">Calculated Hire Fee</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {(printDoc.customer.rentals || []).filter(r => r.status === "Active").map(r => {
                            const calculatedFee = calculateMachineRentForMonth(r, data.activeMonth);
                            return (
                              <tr key={r.machineId}>
                                <td className="p-2.5 font-mono font-bold text-sky-700">{r.machineCode}</td>
                                <td className="p-2.5 font-bold text-slate-900">
                                  {r.model}
                                  {r.isProratedFirstMonth && calculatedFee !== Number(r.rentRate || 0) && (
                                    <span className="text-[10px] font-normal text-amber-700 ml-1">(Prorated)</span>
                                  )}
                                </td>
                                <td className="p-2.5 font-mono text-slate-600">{r.serialNumber}</td>
                                <td className="p-2.5 text-slate-600">{r.accessories}</td>
                                <td className="p-2.5 text-right font-mono font-bold text-slate-900">LKR {calculatedFee.toLocaleString()}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>

                      <div className="border border-slate-300 p-4 rounded-xl bg-slate-50 grid grid-cols-4 gap-2 text-center">
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Active Month Hire</span>
                          <div className="font-black text-slate-900 font-mono mt-0.5">LKR {getActiveRentForCustomerInMonth(printDoc.customer, data.activeMonth).toLocaleString()}</div>
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Carried Arrears (පෙර හිඟ)</span>
                          <div className="font-black text-slate-700 font-mono mt-0.5">LKR {Number(printDoc.customer.arrears || 0).toLocaleString()}</div>
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Payments Credited</span>
                          <div className="font-black text-emerald-600 font-mono mt-0.5">LKR {Number(printDoc.customer.totalPaid || 0).toLocaleString()}</div>
                        </div>
                        <div>
                          <span className="text-rose-600 text-[10px] uppercase font-black">Net Balance Due</span>
                          <div className="font-black text-rose-600 font-mono text-base mt-0.5">LKR {(Number(printDoc.customer.arrears || 0) + getActiveRentForCustomerInMonth(printDoc.customer, data.activeMonth) - (printDoc.customer.totalPaid || 0)).toLocaleString()}</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 2. ADVANCED LEASE AGREEMENT */}
                  {printDoc.type === "AGREEMENT" && (
                    <div className="space-y-4 text-xs">
                      <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl grid grid-cols-2 gap-4">
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-bold">The Lessor (Owner / Management):</p>
                          <p className="font-black text-slate-950 text-sm">{data.company.name}</p>
                          <p className="text-slate-600 mt-0.5">{data.company.addressEn}</p>
                          <p className="text-slate-600 font-mono">Hotline: {data.company.hotline}</p>
                        </div>
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-bold">The Lessee (Hirer / Factory):</p>
                          <p className="font-black text-slate-950 text-sm">{printDoc.customer.name}</p>
                          <p className="text-slate-600 mt-0.5">{printDoc.customer.address}</p>
                          <p className="text-slate-600 font-mono">Contact: {printDoc.customer.phone} | Reg / NIC: {printDoc.customer.nic || "Verified"}</p>
                        </div>
                      </div>

                      <div className="font-bold text-slate-900 border-b border-slate-200 pb-1 uppercase tracking-wider text-[11px]">
                        1. Schedule of Rented Industrial Machinery Fleet
                      </div>
                      <table className="w-full text-left text-xs border border-slate-300">
                        <thead className="bg-slate-100 font-bold border-b border-slate-300 text-slate-900">
                          <tr><th className="p-2.5">Unit Code</th><th className="p-2.5">Machinery Model Description</th><th className="p-2.5">Serial Number (SN)</th><th className="p-2.5 text-right">Agreed Monthly Hire</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {(printDoc.customer.rentals || []).filter(r => r.status === "Active").map(r => (
                            <tr key={r.machineId}>
                              <td className="p-2.5 font-mono font-bold text-sky-700">{r.machineCode}</td>
                              <td className="p-2.5 font-bold text-slate-900">{r.model}</td>
                              <td className="p-2.5 font-mono text-slate-600">{r.serialNumber}</td>
                              <td className="p-2.5 text-right font-mono font-bold text-slate-900">LKR {Number(r.rentRate || 0).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl space-y-2 text-[11px] leading-relaxed text-slate-700">
                        <div className="font-bold text-slate-900 uppercase">2. Terms, Conditions & Covenants of Lease Agreement:</div>
                        <p><b>i. Absolute Ownership:</b> The machinery listed above remains at all times the sole absolute property of <b>Anujaya Enterprises, Kosgama</b>. The Lessee shall not mortgage, pledge, sell, or transfer the equipment under any circumstance.</p>
                        <p><b>ii. Maintenance & Servicing:</b> Periodic mechanical inspections, looper adjustments, and technical oversight are provided by Kosgama Central Yard. The Lessee agrees to operate machinery with qualified personnel and maintain proper lubrication daily.</p>
                        <p><b>iii. Monthly Remittance:</b> Monthly hire rental is payable in advance on or before the 5th day of each calendar month directly to Bank of Ceylon Account No: <b>94459826</b>.</p>
                        <p><b>iv. Repossession Rights:</b> In the event of rent default exceeding 30 days or unauthorized relocation of machinery, Anujaya Enterprises reserves the legal right to enter premises and repossess the entire fleet without prior notice.</p>
                      </div>
                    </div>
                  )}

                  {/* 3. ADVANCED MACHINERY DISPATCH & DELIVERY NOTE */}
                  {printDoc.type === "DELIVERY" && (
                    <div className="space-y-4 text-xs">
                      <div className="grid grid-cols-2 gap-4 p-4 rounded-xl bg-slate-50 border border-slate-300">
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-bold">Consignee (Delivery Factory Site):</p>
                          <p className="text-sm font-black text-slate-950">{printDoc.customer.name}</p>
                          <p className="text-slate-600 mt-0.5">{printDoc.customer.address}</p>
                          <p className="text-slate-600 font-mono">Contact: {printDoc.customer.phone}</p>
                        </div>
                        <div className="text-right">
                          <p className="text-[10px] text-slate-500 uppercase font-bold">Logistics & Transport Dispatch Note:</p>
                          <p className="font-mono font-bold text-slate-900 text-sm">Gatepass Ref: DEL-{Date.now().toString().slice(-6)}</p>
                          <p className="text-slate-600">Transport Lorry: {printDoc.meta?.vehicleNo || "WP-ND-4521"}</p>
                          <p className="text-slate-600">Assigned Driver: {printDoc.meta?.driverName || "K. G. Karunaratne"} ({printDoc.meta?.driverPhone})</p>
                        </div>
                      </div>

                      <div className="font-bold text-slate-900 border-b border-slate-200 pb-1 uppercase tracking-wider text-[11px]">
                        Dispatched Machinery Fleet & Inventory Checklist
                      </div>
                      <table className="w-full text-left text-xs border border-slate-300">
                        <thead className="bg-slate-100 font-bold border-b border-slate-300 text-slate-900">
                          <tr><th className="p-2.5">Code</th><th className="p-2.5">Model Description</th><th className="p-2.5">Serial Number (SN)</th><th className="p-2.5">Included Attachments & Accessories</th><th className="p-2.5 text-center">Status</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {(printDoc.customer.rentals || []).filter(r => r.status === "Active").map(r => (
                            <tr key={r.machineId}>
                              <td className="p-2.5 font-mono font-bold text-sky-700">{r.machineCode}</td>
                              <td className="p-2.5 font-bold text-slate-900">{r.model}</td>
                              <td className="p-2.5 font-mono text-slate-600">{r.serialNumber}</td>
                              <td className="p-2.5 text-slate-600">{r.accessories}</td>
                              <td className="p-2.5 text-center font-bold text-emerald-700">Checked & Tested OK</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl space-y-1 text-[11px]">
                        <p className="font-bold text-slate-900 uppercase">Pre-Dispatch Yard Certification:</p>
                        <p className="text-slate-600">"All sewing heads, direct-drive servo motors, tables, heavy-duty stands, and thread stands listed above have been bench-tested, lubricated, and certified 100% operational at Kosgama Central Yard prior to dispatch."</p>
                        <p className="text-slate-600 mt-1"><b>Logistics Notes:</b> {printDoc.meta?.notes}</p>
                      </div>
                    </div>
                  )}

                  {/* 4. ADVANCED RETURN GATEPASS & CREDIT RELIEF NOTE */}
                  {printDoc.type === "RETURN" && (
                    <div className="space-y-4 text-xs">
                      <div className="grid grid-cols-2 gap-4 p-4 rounded-xl bg-rose-50/50 border border-rose-200">
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-bold">Returned From (Client / Factory):</p>
                          <p className="text-sm font-black text-slate-950">{printDoc.customer.name}</p>
                          <p className="text-slate-600 mt-0.5">{printDoc.customer.address} · {printDoc.customer.phone}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-mono font-bold text-slate-900 text-sm">Inward Slip Ref: {printDoc.meta?.slipNo}</p>
                          <p className="text-slate-600 font-mono">Return Date: {printDoc.meta?.returnDate}</p>
                          <p className="text-slate-600">Receiving Yard Inspector: {printDoc.meta?.inspector}</p>
                        </div>
                      </div>

                      <div className="font-bold text-rose-950 border-b border-rose-200 pb-1 uppercase tracking-wider text-[11px]">
                        Inward Returned Machinery Fleet & Rent Relief Schedule
                      </div>
                      <table className="w-full text-left text-xs border border-rose-200">
                        <thead className="bg-rose-100/70 font-bold border-b border-rose-200 text-rose-950">
                          <tr><th className="p-2.5">Code</th><th className="p-2.5">Machine Model Description</th><th className="p-2.5">Serial Number (SN)</th><th className="p-2.5 text-right">Relieved Monthly Rent</th></tr>
                        </thead>
                        <tbody className="divide-y divide-rose-100">
                          {(printDoc.returnedMachines || []).map((m, i) => (
                            <tr key={i}>
                              <td className="p-2.5 font-mono font-bold text-slate-900">{m.machineCode}</td>
                              <td className="p-2.5 font-bold text-slate-800">{m.model}</td>
                              <td className="p-2.5 font-mono text-slate-700">{m.serialNumber}</td>
                              <td className="p-2.5 text-right font-mono font-bold text-emerald-700">LKR {Number(m.rentRate || 0).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl space-y-1.5 text-[11px]">
                        <p className="font-bold text-slate-900">Yard Inspection & Condition Verification:</p>
                        <p><b>Physical Condition:</b> <span className="text-rose-700 font-bold">{printDoc.meta?.condition}</span></p>
                        <p className="text-slate-600"><b>Central Yard Remarks:</b> {printDoc.meta?.remarks}</p>
                        <p className="text-emerald-700 font-bold mt-1">✓ Monthly recurring rent demand has been automatically reduced by the relieved amount effective from the next billing cycle.</p>
                      </div>
                    </div>
                  )}

                  {/* 5. COMMERCIAL QUOTATION */}
                  {printDoc.type === "QUOTATION" && (
                    <div className="space-y-4 text-xs">
                      <div className="grid grid-cols-2 gap-4 p-4 rounded-xl bg-slate-50 border border-slate-300">
                        <div>
                          <p className="text-[10px] text-slate-500 uppercase font-bold">Proposal Prepared For:</p>
                          <p className="text-sm font-black text-slate-950">{printDoc.quotation.customerName}</p>
                          <p className="text-slate-600">{printDoc.quotation.address}</p>
                          <p className="text-slate-600">Contact: {printDoc.quotation.phone}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-mono font-bold text-slate-900">Quote Ref: {printDoc.quotation.quoteNo}</p>
                          <p className="text-slate-600">Validity: {printDoc.quotation.validDays} Days from Issue</p>
                          <p className="text-slate-600">Advance Term: {printDoc.quotation.advanceMonths} Month(s) Upfront</p>
                        </div>
                      </div>

                      <table className="w-full text-left text-xs border border-slate-300">
                        <thead className="bg-slate-100 font-bold border-b border-slate-300">
                          <tr><th className="p-3">Machinery Model Description</th><th className="p-3">Specification / Motor</th><th className="p-3 text-center">Qty</th><th className="p-3 text-right">Rent / Unit</th><th className="p-3 text-right">Monthly Total</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                          {printDoc.quotation.items.map((it, idx) => (
                            <tr key={idx}>
                              <td className="p-3 font-semibold text-slate-900">{it.description}</td>
                              <td className="p-3 text-slate-600">{it.motorSpec || "Servo Motor Set"}</td>
                              <td className="p-3 text-center font-bold">{it.qty}</td>
                              <td className="p-3 text-right font-mono">LKR {Number(it.rate || 0).toLocaleString()}</td>
                              <td className="p-3 text-right font-mono font-black text-slate-950">LKR {(it.qty * it.rate).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>

                      <div className="grid grid-cols-3 gap-3 p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-center">
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Total Monthly Hire</span>
                          <div className="font-black text-slate-950 font-mono text-sm mt-0.5">
                            LKR {printDoc.quotation.items.reduce((s, i) => s + (i.qty * i.rate), 0).toLocaleString()}
                          </div>
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Refundable Security Deposit</span>
                          <div className="font-black text-amber-700 font-mono text-sm mt-0.5">
                            LKR {Number(printDoc.quotation.depositAmount || 0).toLocaleString()}
                          </div>
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] uppercase font-bold">Transport & Installation</span>
                          <div className="font-black text-emerald-700 font-mono text-sm mt-0.5">
                            LKR {Number(printDoc.quotation.transportCharge || 0).toLocaleString()}
                          </div>
                        </div>
                      </div>

                      <div className="p-3 bg-slate-50 border border-slate-200 rounded-lg text-[11px] leading-relaxed">
                        <p><b>Service Guarantee:</b> {printDoc.quotation.serviceSupport}</p>
                        <p className="mt-1 whitespace-pre-line text-slate-600"><b>Terms of Offer:</b> {printDoc.quotation.specialTerms}</p>
                      </div>
                    </div>
                  )}

                  {/* 6. PAYMENT RECEIPT */}
                  {printDoc.type === "RECEIPT" && (
                    <div className="space-y-4 text-xs">
                      <div className="p-5 bg-emerald-50/60 border border-emerald-300 rounded-2xl flex justify-between items-center">
                        <div>
                          <span className="text-xs font-black text-emerald-950 uppercase tracking-wide">Receipt of Monthly Rent Collection</span>
                          <h2 className="text-3xl font-black text-emerald-700 mt-1 font-mono">LKR {Number(printDoc.payment.amount || 0).toLocaleString()}</h2>
                          <p className="text-[11px] text-emerald-900 mt-1">Status: Credited to Kosgama Central Settlement Account</p>
                        </div>
                        <div className="text-right">
                          <p className="font-mono font-bold text-slate-900 text-sm">{printDoc.payment.refNo}</p>
                          <p className="text-slate-600">Date: {printDoc.payment.date}</p>
                          <p className="text-slate-600 font-bold">{printDoc.payment.method}</p>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50 border border-slate-300 rounded-xl space-y-1.5">
                        <p><b>Received From:</b> {printDoc.customer.name} ({printDoc.customer.code})</p>
                        <p><b>Factory Address:</b> {printDoc.customer.address} | <b>Contact:</b> {printDoc.customer.phone}</p>
                        <p><b>Amount in Words:</b> Sri Lankan Rupees {Number(printDoc.payment.amount || 0).toLocaleString()} Only</p>
                      </div>
                    </div>
                  )}

                  {/* Bank Details Box */}
                  <div className="mt-8 border border-sky-300 bg-sky-50/70 p-3.5 rounded-xl text-xs flex justify-between items-center">
                    <div>
                      <p className="font-bold text-sky-900 uppercase tracking-wider text-[10px] mb-0.5">Official Settlement Remittance Account:</p>
                      <p className="text-slate-800 font-mono">Bank: <b>{data.bank.bankNameEn}</b> | Branch: <b>{data.bank.branchEn}</b> | A/C No: <b className="text-sky-800 text-sm">{data.bank.accountNo}</b> ({data.bank.accountName})</p>
                    </div>
                    <div className="hidden sm:block">
                      <OfficialSealStamp />
                    </div>
                  </div>

                  {/* Executive Signatures */}
                  <div className="mt-10 pt-6 grid grid-cols-2 gap-12 text-xs border-t border-dashed border-slate-300">
                    <div className="text-center">
                      <div className="border-b border-slate-400 pb-10 flex justify-center items-end">
                        <span className="font-serif italic text-slate-400 text-[11px] mb-1">Authorized Management Signatory</span>
                      </div>
                      <p className="mt-2 font-black text-slate-950">ANUJAYA ENTERPRISES</p>
                      <p className="text-[10px] text-slate-500">Central Industrial Yard Operations — Kosgama</p>
                    </div>
                    <div className="text-center">
                      <div className="border-b border-slate-400 pb-10 flex justify-center items-end">
                        <span className="font-serif italic text-slate-400 text-[11px] mb-1">Proprietor / Director Acknowledgment</span>
                      </div>
                      <p className="mt-2 font-black text-slate-950">CUSTOMER / PARTNER AUTHORIZED SIGNATURE</p>
                      <p className="text-[10px] text-slate-500">Official Seal, Date & Signature</p>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
